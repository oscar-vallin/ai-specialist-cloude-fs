spring.application.name=bookstore-backend

# Database: all connection settings come from environment variables.
# The password intentionally has no meaningful default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookstore}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway; data access is plain JDBC (JdbcClient).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Business configuration
app.currency=${APP_CURRENCY:USD}
app.gift-points-per-currency-unit=${APP_GIFT_POINTS_PER_CURRENCY_UNIT:100}

# Do not let Spring Security generate (and log) a default user password. Users come from the member domain.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Actuator: expose only what is needed, never health details to anonymous callers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API docs (Swagger UI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Application configuration (all overridable through environment variables)
app.default-store-name=${APP_DEFAULT_STORE_NAME:Main Store}
app.default-country=${APP_DEFAULT_COUNTRY:US}
app.order.payment-window-minutes=${APP_ORDER_PAYMENT_WINDOW_MINUTES:30}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# The seeded store policy uses the configured gift point rate (placeholder in db/seed SQL).
spring.flyway.placeholders.giftpoints=${app.gift-points-per-currency-unit}

# Requests are strict (additionalProperties: false in the contract); dates are ISO 8601.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Every log line carries the request ID (see RequestIdFilter).
logging.pattern.level=%5p [%X{requestId:-}]

# Mock payment gateway: the only card number it declines (documented in the OpenAPI contract).
app.payment.mock-decline-card-number=${APP_PAYMENT_MOCK_DECLINE_CARD_NUMBER:4000000000000002}
